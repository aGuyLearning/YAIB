command:
  - ${env}
  - ${program}
  - train
  - -d
  - ../data/
  - -t
  - BinaryClassification
  - --log-dir
  - ../yaib_logs
  - --tune
  - --wandb-sweep
  - -gc
  - -lc
method: grid
name: yaib_classification_benchmark
parameters:
  data_dir:
    values:
      - ../data/mortality24/miiv
      - ../data/mortality24/hirid
      - ../data/mortality24/eicu
      - ../data/aki/miiv
      - ../data/aki/hirid
      - ../data/aki/eicu
      - ../data/sepsis/miiv
      - ../data/sepsis/hirid
      - ../data/sepsis/eicu
  model:
    values:
      - LogisticRegression
      - LGBMClassifier
      - GRU
      - LSTM
      - TCN
      - Transformer
  seed:
    values:
      - 1111
  use_pretrained_imputation:
    values:
      - None
program: icu-benchmarks